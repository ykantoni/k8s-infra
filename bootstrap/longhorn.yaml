# Wave 1: default StorageClass; everything with a PVC comes after it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-infra
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.8.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/values/longhorn/values.yaml
    - repoURL: https://github.com/ykantoni/k8s-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
    # Engine and CSI plugin pods mount host block devices and
    # /var/lib/longhorn directly, which RKE2's CIS default (restricted)
    # forbids.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  # Two sources of server-side defaulting Argo's git-rendered desired state
  # doesn't account for, confirmed via `argocd app diff`: longhorn-manager
  # injects a conversion webhook (incl. a freshly-generated CA cert) into
  # its own CRDs after install, and the v1 CRD API auto-sets
  # preserveUnknownFields: false (a structural-schema requirement) even
  # though the chart's raw template omits it. Without both, every
  # comparison sees drift and the Application never settles out of
  # OutOfSync, even right after a successful sync.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
        - /spec/preserveUnknownFields
