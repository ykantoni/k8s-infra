# Wave -1: every later Application may ship SealedSecrets. Runs in
# kube-system as "sealed-secrets-controller", the name kubeseal defaults to.
# On a rebuilt cluster it adopts the key pair vm-infra's modules/argocd
# restored before Argo CD existed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-infra
  sources:
    - repoURL: https://bitnami-labs.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.17.3
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/values/sealed-secrets/values.yaml
    - repoURL: https://github.com/ykantoni/k8s-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
