# Grafana's login, referenced by values/kube-prometheus-stack/values.yaml
# (grafana.admin.existingSecret). Write it to OpenBao with:
#   bao kv put secret/monitoring/grafana-admin admin-user=admin admin-password=...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: monitoring/grafana-admin
