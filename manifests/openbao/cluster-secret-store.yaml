# What every ExternalSecret in k8s-infra and k8s-apps reads through. Wave 2:
# after the bootstrap Job (wave 1) has created the external-secrets role it
# authenticates as. openbao-active only ever selects the unsealed leader.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
