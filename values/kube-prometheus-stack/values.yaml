prometheus:
  prometheusSpec:
    retention: 15d

    # nil (the chart's own default) restricts discovery to monitors carrying
    # this release's label, which exists for multi-tenant clusters. This is a
    # single-tenant cluster, so pick up every ServiceMonitor/PodMonitor/
    # PrometheusRule in any namespace (GPU operator's DCGM exporter included).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  # LoadBalancer gets an address from the Cilium LB-IPAM pool
  # (charts/cilium-lb-ipam); this cluster runs no ingress controller.
  service:
    type: LoadBalancer

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true

  # Login comes from the grafana-admin ExternalSecret in
  # manifests/kube-prometheus-stack/ (OpenBao secret/monitoring/grafana-admin),
  # not a password in this file. Grafana stays Pending until that secret
  # exists; see README.md "Secrets".
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: LoadBalancer

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
